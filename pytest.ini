[pytest]
testpaths = tests
base_url = https://usa.brewdog.com

# Default run: Chromium, screenshot + video + trace saved only when a test fails,
# and a single-file HTML report in the reports/ folder.
addopts =
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: fast checks that the main pages load and work
    regression: deeper checks of key user flows
    mobile: checks on a mobile-sized screen
